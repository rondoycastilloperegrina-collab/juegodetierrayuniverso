<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Misión Cosmos: Tierra y Universo</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap">
<style>
:root{--bg:#070b24;--panel:#121a4a;--line:#3b4ba8;--ink:#f4f6ff;--sun:#ffc83d;--cyan:#4fd8ff;--ok:#3ddc97;--bad:#ff5d73;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:'Fredoka','Trebuchet MS',system-ui,sans-serif}
body{background:radial-gradient(circle at 20% 10%,#1b2670 0,transparent 45%),radial-gradient(circle at 85% 80%,#3a1b66 0,transparent 40%),var(--bg);min-height:100vh}
.stars{position:fixed;inset:0;pointer-events:none;background-image:radial-gradient(2px 2px at 20px 30px,#fff,transparent),radial-gradient(1.5px 1.5px at 90px 120px,#cde,transparent),radial-gradient(2px 2px at 160px 60px,#fff,transparent),radial-gradient(1px 1px at 230px 170px,#fff,transparent);background-size:260px 200px;opacity:.7}
.screen{display:none;position:relative;max-width:560px;margin:0 auto;padding:14px 16px 28px}
.screen.on{display:block}
button{font-family:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
/* portada */
#cover{text-align:center;padding-top:20px}
.hero{position:relative;border-radius:22px;overflow:hidden;border:2px solid var(--line);aspect-ratio:2/1}
.hero img{width:100%;height:100%;object-fit:cover;display:block}
.hero .astro{position:absolute;right:8%;bottom:6%;font-size:64px;animation:float 3.5s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-12px) rotate(6deg)}}
h1{font-size:2.5rem;line-height:1.05;margin:20px 0 8px;font-weight:700;color:var(--sun);text-shadow:0 3px 0 #7a4d00}
.sub{font-size:1.15rem;margin:0 0 6px;color:#dbe3ff}
.meta{font-size:.9rem;color:#9fb0f0;margin:14px 0 22px}
.big{background:var(--sun);color:#2b1a00;border:0;border-radius:999px;padding:15px 34px;font-size:1.3rem;font-weight:700;box-shadow:0 5px 0 #a87400}
.big:active{transform:translateY(3px);box-shadow:0 2px 0 #a87400}
/* juego */
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;font-weight:600}
.pill{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:1rem}
.mute{background:var(--panel);border:1px solid var(--line);color:var(--ink);border-radius:999px;width:42px;height:38px;font-size:1.1rem}
.track{position:relative;height:100px;margin:12px 30px 6px}
.track .rail{position:absolute;left:0;right:0;top:80px;height:4px;border-radius:4px;background:var(--line)}
.track .done{position:absolute;left:0;top:80px;height:4px;border-radius:4px;background:var(--cyan);transition:width .8s}
.track .stop{position:absolute;top:73px;width:18px;height:18px;margin-left:-9px;border-radius:50%;background:var(--panel);border:2px solid var(--line);font-size:0}
.track .stop.ok{background:var(--ok);border-color:var(--ok)}
.track .stop.no{background:var(--bad);border-color:var(--bad)}
#astro{position:absolute;top:0;font-size:64px;line-height:1;margin-left:-32px;transition:left .8s ease-in-out;filter:drop-shadow(0 4px 6px #0008)}
#astro.up{animation:jump 1.5s ease-out}
#astro.down{animation:shake .5s}
@keyframes jump{0%{transform:translateY(0)}30%{transform:translateY(-46px) scale(1.35) rotate(-12deg)}60%{transform:translateY(-34px) scale(1.25) rotate(8deg)}100%{transform:translateY(0)}}
.card{background:var(--panel);border:2px solid var(--line);border-radius:22px;overflow:hidden}
.card .pic{width:100%;height:150px;object-fit:cover;display:block}
.card .body{padding:16px}
.qn{color:var(--cyan);font-size:.95rem;margin:0 0 4px}
.q{font-size:1.4rem;line-height:1.2;margin:0 0 14px;font-weight:600}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:10px;align-items:center;text-align:left;background:#0c1238;color:var(--ink);border:2px solid var(--line);border-radius:16px;padding:12px 14px;font-size:1.08rem;line-height:1.25}
.opt b{flex:none;width:30px;height:30px;border-radius:50%;background:var(--line);display:grid;place-items:center}
.opt:hover:not(:disabled){border-color:var(--cyan)}
.opt.ok{border-color:var(--ok);background:#0f3b2d}
.opt.ok b{background:var(--ok);color:#06241a}
.opt.no{border-color:var(--bad);background:#40121c}
.opt.no b{background:var(--bad)}
.opt:disabled{cursor:default}
.fb{margin-top:14px;padding:12px 14px;border-radius:16px;background:#0c1238;border-left:6px solid var(--cyan);font-size:1.02rem;line-height:1.35}
.fb.ok{border-color:var(--ok)}.fb.no{border-color:var(--bad)}
.fb strong{display:block;font-size:1.15rem;margin-bottom:2px}
.next{margin-top:14px;width:100%;background:var(--cyan);color:#032b36;border:0;border-radius:999px;padding:13px;font-size:1.15rem;font-weight:700;box-shadow:0 4px 0 #1b7e96}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
/* final */
#end{text-align:center;padding-top:24px}
.medal{font-size:96px;animation:float 3s ease-in-out infinite}
#end h2{font-size:2rem;margin:6px 0;color:var(--sun)}
.score{font-size:1.3rem;margin:6px 0 20px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="stars"></div>

<section id="cover" class="screen on">
  <div class="hero"><img id="coverImg" alt="Galaxia espiral en el espacio"><div class="astro" aria-hidden="true">🧑‍🚀</div></div>
  <h1>Tierra y Universo</h1>
  <p class="sub">Mirar el cielo para comprender nuestro lugar en el cosmos</p>
  <p class="meta">Educación Primaria VI B · Alfabetización Científica · Piura, Perú 2026</p>
  <button class="big" id="start">¡Despegar!</button>
</section>

<section id="game" class="screen">
  <div class="top">
    <span class="pill" id="lives" aria-label="Vidas"></span>
    <span class="pill" id="score">⭐ 0</span>
    <button class="mute" id="mute" aria-label="Silenciar música">🔊</button>
  </div>
  <div class="track" id="track"><div class="rail"></div><div class="done" id="done"></div><div id="astro">🧑‍🚀</div></div>
  <div class="card">
    <img class="pic" id="pic" alt="">
    <div class="body">
      <p class="qn" id="qn"></p>
      <h2 class="q" id="q"></h2>
      <div class="opts" id="opts"></div>
      <div id="fbBox"></div>
    </div>
  </div>
</section>

<section id="end" class="screen">
  <div class="medal" id="medal"></div>
  <h2 id="endTitle"></h2>
  <p class="score" id="endScore"></p>
  <p id="endMsg" class="sub"></p>
  <p style="margin-top:22px"><button class="big" id="again">Jugar otra vez</button></p>
</section>

const Q=[
{i:'gal',q:'¿Cómo se llama la galaxia donde vivimos?',o:['Andrómeda','Vía Láctea','Remolino'],a:1,e:'Vía Láctea significa "camino de leche", por la franja blanca de estrellas que se ve en las noches serenas.'},
{i:'gal',q:'¿Qué forma tiene la Vía Láctea?',o:['Espiral','Elíptica','Irregular'],a:0,e:'Es una galaxia espiral, con una barra central y cuatro brazos principales.'},
{i:'sol',q:'¿Qué es el Sol?',o:['Un planeta','Un satélite','Una estrella'],a:2,e:'El Sol es una enorme esfera de gas (hidrógeno y helio) que produce luz y calor. Es nuestra estrella más cercana.'},
{i:'sol',q:'¿Cuál es el planeta más grande del Sistema Solar?',o:['Júpiter','Saturno','Tierra'],a:0,e:'Júpiter es el planeta más grande del Sistema Solar.'},
{i:'sol',q:'¿Qué planeta es conocido como el "planeta rojo"?',o:['Venus','Marte','Mercurio'],a:1,e:'Marte es el planeta rojo; en el pasado tuvo agua líquida.'},
{i:'sol',q:'¿Qué planeta es famoso por sus anillos de hielo y roca?',o:['Neptuno','Urano','Saturno'],a:2,e:'Saturno es famoso por sus vistosos anillos de hielo y roca.'},
{i:'tie',q:'¿Cuál es la capa sólida de la Tierra donde vivimos?',o:['Corteza','Manto','Núcleo'],a:0,e:'La corteza es la capa superficial sólida. Debajo están el manto (roca muy caliente) y el núcleo de hierro y níquel.'},
{i:'tie',q:'¿Qué movimiento de la Tierra produce el día y la noche?',o:['Traslación','Rotación','Gravedad'],a:1,e:'La rotación es el giro de la Tierra sobre su eje; dura unas 24 horas y alterna la luz con la oscuridad.'},
{i:'tie',q:'¿Cuántos días tarda la Tierra en dar una vuelta alrededor del Sol?',o:['24 días','30 días','365 días'],a:2,e:'Con la traslación, la Tierra recorre una órbita alrededor del Sol en 365 días: un año.'},
{i:'gal',q:'¿Qué permite ver el telescopio espacial James Webb?',o:['Solo la Luna y sus cráteres','Los exoplanetas y sus características','Solo las manchas del Sol'],a:1,e:'Los exoplanetas son planetas fuera del Sistema Solar. El Webb muestra qué gases tienen (como metano y dióxido de carbono), si son gaseosos o rocosos y hasta cómo se forma un planeta.'},
{i:'sol',q:'¿Por qué la Luna se ve brillante?',o:['Tiene luz propia','Refleja la luz del Sol','Está hecha de hielo'],a:1,e:'La Luna es un satélite rocoso que no tiene luz propia; vemos sus fases según la posición del Sol, la Tierra y la Luna.'},
{i:'sol',q:'¿Por qué no vemos las estrellas durante el día?',o:['Se apagan','Se esconden detrás de la Luna','El brillo del Sol las opaca'],a:2,e:'Las estrellas siguen allí; el intenso brillo de nuestro Sol cercano simplemente las opaca. La Luna, por su parte, no tiene luz propia: refleja la del Sol.'}
];
const $=id=>document.getElementById(id);
let n=0,lives=3,pts=0,locked=false,muted=false,res=[];

/* audio */
let AC,mg,musicTimer;
function initAudio(){if(AC)return;try{AC=new (window.AudioContext||window.webkitAudioContext)();mg=AC.createGain();mg.gain.value=.5;mg.connect(AC.destination);}catch(e){}}
function tone(f,t,d,type,v,dest){if(!AC)return;const o=AC.createOscillator(),g=AC.createGain();o.type=type||'sine';o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(dest||mg);o.start(t);o.stop(t+d+.05)}
const scale=[261.6,293.7,329.6,392,440,523.3,587.3,659.3];
const pat=[0,2,4,2,5,4,2,4,3,2,1,2,4,5,7,4];
let step=0;
function startMusic(){if(!AC||musicTimer)return;musicTimer=setInterval(()=>{if(muted||AC.state!=='running')return;const t=AC.currentTime+.05;const s=step%pat.length;tone(scale[pat[s]],t,.22,'square',.035);if(s%2===0)tone(scale[pat[s]]/2,t,.2,'triangle',.08);if(s%4===0)tone(scale[0]/4,t,.5,'sine',.12);step++},230)}
function sfx(kind){if(!AC||muted)return;const t=AC.currentTime;if(kind==='ok'){[523,659,784,1046].forEach((f,i)=>tone(f,t+i*.09,.25,'square',.09))}else if(kind==='no'){tone(200,t,.3,'sawtooth',.12);tone(140,t+.18,.4,'sawtooth',.12)}else if(kind==='win'){[523,659,784,659,784,1046,1318].forEach((f,i)=>tone(f,t+i*.12,.3,'triangle',.12))}else{tone(400,t,.1,'sine',.1)}}
$('mute').onclick=()=>{muted=!muted;$('mute').textContent=muted?'🔇':'🔊';$('mute').setAttribute('aria-label',muted?'Activar música':'Silenciar música')};

/* juego */
function buildTrack(){const t=$('track');t.querySelectorAll('.stop').forEach(e=>e.remove());Q.forEach((_,i)=>{const s=document.createElement('span');s.className='stop';s.id='s'+i;s.style.left=(i/(Q.length-1)*100)+'%';t.appendChild(s)})}
function moveAstro(){const p=n/(Q.length-1)*100;$('astro').style.left=p+'%';$('done').style.width=p+'%'}
function hud(){$('lives').textContent='🚀'.repeat(lives)+'🌑'.repeat(3-lives);$('score').textContent='⭐ '+pts}
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('on',s.id===id));window.scrollTo(0,0)}
function anim(c){const a=$('astro');a.className='';void a.offsetWidth;a.className=c}
function ask(){locked=false;$('astro').className='';const d=Q[n];moveAstro();hud();$('pic').src=IMG[d.i];$('qn').textContent='Parada '+(n+1)+' de '+Q.length;$('q').textContent=d.q;$('fbBox').innerHTML='';
const idx=d.o.map((_,i)=>i).sort(()=>Math.random()-.5);const box=$('opts');box.innerHTML='';
idx.forEach((oi,k)=>{const b=document.createElement('button');b.className='opt';b.innerHTML='<b>'+'ABC'[k]+'</b><span></span>';b.lastChild.textContent=d.o[oi];b.onclick=()=>pick(b,oi===d.a);b.dataset.c=oi===d.a?'1':'';box.appendChild(b)})}
function pick(btn,right){if(locked)return;locked=true;const d=Q[n];
document.querySelectorAll('.opt').forEach(b=>{b.disabled=true;if(b.dataset.c)b.classList.add('ok')});
if(right){pts++;sfx('ok');res[n]=1;$('s'+n).classList.add('ok');anim('up')}else{lives--;btn.classList.add('no');btn.classList.add('shake');sfx('no');res[n]=0;$('s'+n).classList.add('no');anim('down')}
hud();const last=n===Q.length-1||lives===0;
$('fbBox').innerHTML='<div class="fb '+(right?'ok':'no')+'"><strong>'+(right?'¡Correcto! ⭐':'¡Casi! La respuesta correcta está en verde')+'</strong><span id="ex"></span></div><button class="next" id="nx">'+(last?'Ver mi medalla':'Seguir viajando 🚀')+'</button>';
$('ex').textContent=d.e;$('nx').onclick=()=>{sfx('tap');if(last)finish();else{n++;ask()}};$('nx').scrollIntoView({block:'nearest',behavior:'smooth'})}
function finish(){show('end');sfx('win');const full=pts===Q.length;let m,t,msg;
if(pts>=11){m='🥇';t='¡Comandante del Cosmos!';msg='Conoces el universo como un verdadero astronauta.'}
else if(pts>=8){m='🥈';t='¡Astronauta experto!';msg='Muy buen viaje. Con un poco más de práctica llegas al oro.'}
else if(pts>=5){m='🥉';t='¡Astronauta en entrenamiento!';msg='Vas por buen camino. Vuelve a despegar y mejora tu puntaje.'}
else{m='🌟';t='¡Cadete espacial!';msg='Todo gran astronauta empezó aprendiendo. ¡Intenta otra misión!'}
if(lives===0&&n<Q.length-1)msg='Se acabaron los cohetes en la parada '+(n+1)+'. '+msg;
$('medal').textContent=m;$('endTitle').textContent=t;$('endScore').textContent='Respondiste bien '+pts+' de '+Q.length+' preguntas ⭐'+(full?' ¡Perfecto!':'');$('endMsg').textContent=msg}
function play(){n=0;lives=3;pts=0;res=[];buildTrack();show('game');ask()}
$('start').onclick=()=>{initAudio();if(AC&&AC.state==='suspended')AC.resume();startMusic();sfx('tap');play()};
$('again').onclick=()=>{sfx('tap');play()};
$('coverImg').src=IMG.gal;
</script>
